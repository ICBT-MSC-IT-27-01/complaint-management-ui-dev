<aside class="cms-sidebar" [class.collapsed]="collapsed" [class.mobile-open]="mobileOpen">
  <div class="sidebar-brand">
    <div class="brand-left">
      <div class="brand-icon"><i class="bi bi-shield-check"></i></div>
      <div class="brand-copy" *ngIf="!collapsed">
        <span class="brand-text">CompliMate</span>
        <small>Compliance Management</small>
      </div>
    </div>
    <button
      type="button"
      class="btn-collapse"
      (click)="toggleSidebar.emit()"
      [title]="collapsed ? 'Expand sidebar' : 'Collapse sidebar'"
    >
      <i class="bi" [ngClass]="collapsed ? 'bi-chevron-right' : 'bi-chevron-left'"></i>
    </button>
  </div>

  <nav class="sidebar-nav">
    <ng-container *ngFor="let section of sections">
      <p class="nav-section" *ngIf="!collapsed">{{ section }}</p>
      <ng-container *ngFor="let item of sectionItems(section)">
        <a
          class="nav-item"
          [routerLink]="item.route"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }"
          [title]="collapsed ? item.label : ''"
        >
          <i class="bi" [ngClass]="'bi-' + item.icon"></i>
          <span *ngIf="!collapsed">{{ item.label }}</span>
        </a>
      </ng-container>
    </ng-container>
  </nav>

  <div class="sidebar-footer">
    <a class="nav-item" routerLink="/profile" routerLinkActive="active" [title]="collapsed ? 'Profile' : ''">
      <i class="bi bi-person-circle"></i>
      <span *ngIf="!collapsed">My Profile</span>
    </a>
    <button class="nav-item btn-logout" (click)="auth.logout()" [title]="collapsed ? 'Logout' : ''">
      <i class="bi bi-box-arrow-right"></i>
      <span *ngIf="!collapsed">Logout</span>
    </button>
  </div>
</aside>
